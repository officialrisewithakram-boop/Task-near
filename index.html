<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasknear – Home Services Near You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#f5f7fb;color:#222;}

/* HEADER */
header{
  background:#111827;
  padding:12px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:22px;
  font-weight:bold;
  color:#22c55e;
}
nav a{
  color:#fff;
  text-decoration:none;
  margin-left:18px;
  font-size:14px;
}

/* HERO SECTION */
.hero{
  background:url('images/hero.jpg') center/cover no-repeat;
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}
.hero-content{
  position:relative;
  color:#fff;
  max-width:700px;
}
.hero h1{
  font-size:42px;
  margin-bottom:10px;
}
.hero p{
  font-size:18px;
  margin-bottom:20px;
}
.hero button{
  background:#22c55e;
  border:none;
  padding:12px 24px;
  color:#fff;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}

/* SERVICES */
.section-title{
  text-align:center;
  margin:40px 0 10px;
  font-size:28px;
}
.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:0.3s;
}
.card:hover{transform:translateY(-6px);}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}
.card .content{
  padding:15px;
}
.card h3{
  margin-bottom:8px;
}
.card button{
  margin-top:10px;
  background:#22c55e;
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
}

/* FLOAT BUTTONS */
.call-btn{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#0ea5e9;
  color:#fff;
  padding:12px 18px;
  border-radius:30px;
  text-decoration:none;
  font-size:14px;
}
.whatsapp-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25d366;
  color:#fff;
  padding:12px 18px;
  border-radius:30px;
  text-decoration:none;
  font-size:14px;
}

/* FOOTER */
footer{
  background:#111827;
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top:40px;
}
</style>
</head>
<body>

<header>
  <div class="logo">Tasknear</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Professional Home Services</h1>
    <p>Carpenter, Modular Kitchen, Wardrobe, Interior & More</p>
    <button>Book Service</button>
  </div>
</section>

<h2 class="section-title">Our Services</h2>

<section class="services">

  <div class="card">
    <img src="images/carpenter.jpg">
    <div class="content">
      <h3>Carpenter Service</h3>
      <button>View Details</button>
    </div>
  </div>

  <div class="card">
    <img src="images/kitchen.jpg">
    <div class="content">
      <h3>Modular Kitchen</h3>
      <button>View Details</button>
    </div>
  </div>

  <div class="card">
    <img src="images/bedroom.jpg">
    <div class="content">
      <h3>Bedroom Interior</h3>
      <button>View Details</button>
    </div>
  </div>

  <div class="card">
    <img src="images/wardrobe.jpg">
    <div class="content">
      <h3>Wardrobe Design</h3>
      <button>View Details</button>
    </div>
  </div>

  <div class="card">
    <img src="images/door.jpg">
    <div class="content">
      <h3>Wooden Door</h3>
      <button>View Details</button>
    </div>
  </div>

</section>

<a href="tel:9876543210" class="call-btn">📞 Call Now</a>
<a href="https://wa.me/919876543210" class="whatsapp-btn">💬 WhatsApp</a>

<footer>
  © 2026 Tasknear | All Rights Reserved
</footer>

</body>
</html>
